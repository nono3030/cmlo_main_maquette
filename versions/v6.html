  function updateResults(flow) {
    var res = searchCat(S[flow].search), ul = $("#results-" + flow), c = $("#results-count-" + flow);
    if (ul) ul.innerHTML = resultsHtml(flow, res);
    if (c) c.textContent = res.length + " résultat(s)";
  }
  function goBackA() { S.A.phase = "scan"; S.A.form = null; S.A.err = null; render(); focusLater(entryFocus("A")); }
  function goBackC() { S.C.sel = null; S.C.form = null; S.C.err = null; render(); focusLater(entryFocus("C")); }
  function clearFieldError(st, key, el, formSel) {
    if (!st.err || !st.err[key]) return;
    delete st.err[key];
    el.removeAttribute("aria-invalid"); el.removeAttribute("aria-describedby");
    var m = document.getElementById(el.id + "-err"); if (m) m.remove();
    if (!Object.keys(st.err).some(function (x) { return x !== "_sum"; })) { var s = $(formSel + " > .notice.err"); if (s) s.remove(); st.err = null; }
  }

  /* ---------- Événements ---------- */
  document.addEventListener("click", function (e) {
    var tab = e.target.closest(".flows [role=tab]");
    if (tab) {
      S.flow = tab.getAttribute("data-flow"); render();
      if (e.detail > 0 && S.flow !== "cmp") { var f0 = $(entryFocus(S.flow)); if (f0) f0.focus(); } // souris : prêt à scanner ; clavier : le focus reste sur l'onglet
      return;
    }
    var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    var act = b.getAttribute("data-act"), flow = b.getAttribute("data-flow"), id = b.getAttribute("data-id"), ln, r;
    switch (act) {
      case "room":
        r = b.getAttribute("data-room");
        if (flow === "A") { S.A.room = r; render(); focusLater(S.A.phase === "form" ? "#a-qty" : entryFocus("A")); }
        else if (flow === "B") { S.B.room = r; if (S.B.err) delete S.B.err.room; render(); focusLater("#room-B-" + r); }
        else if (flow === "C") { S.C.room = r; S.C.sel = null; S.C.form = null; S.C.unknown = null; S.C.err = null; S.C.confirmClose = false; render(); focusLater(S.C.inv[r].closed ? "#room-C-" + r : entryFocus("C")); }
        else if (flow === "D") { S.D.room = r; S.D.flash = null; render(); focusLater(S.D.sel ? "#d-qty" : S.D.unknown ? "#dn-name" : "#scan-D"); }
        break;
      case "goto":
        S.flow = flow; if (b.getAttribute("data-room")) { S.C.room = b.getAttribute("data-room"); S.C.sel = null; S.C.form = null; }
        render(); focusLater(entryFocus(flow)); break;
      case "mode": S[flow].manual = b.getAttribute("data-manual") === "1"; render(); focusLater(entryFocus(flow)); break;
      case "sim": simulateScan(flow, b.getAttribute("data-code")); break;
      case "pick": onPick(flow, id); break;
      case "newart": S[flow].unknown = { code: "" }; render(); focusLater("#new-" + flow + "-name"); break;
      case "cancelnew": addLog(flow, "Création de fiche annulée"); S[flow].unknown = null; render(); focusLater(entryFocus(flow)); break;
      case "a-back": goBackA(); break;
      case "a-room": S.A.room = b.getAttribute("data-room"); render(); focusLater("#a-qty"); break;
      case "a-reject": rejectA(); break;
      case "a-undo":
        var li = liveA(); if (li < 0) break;
        var en = S.A.last[li], lo = lotById(en.lotId);
        stock = stock.filter(function (l) { return l.id !== en.lotId; }); en.undone = true;
        addLog("A", "Annulé : " + lo.qty + " × " + label(art(lo.articleId)));
        toast("Entrée annulée : " + lo.qty + " × " + label(art(lo.articleId)) + ".");
        render(); focusLater(liveA() >= 0 ? "#a-undo" : S.A.phase === "form" ? "#a-qty" : S.A.room ? entryFocus("A") : "#room-A-pharma"); break;
      case "b-cancel": S.B.confirmCancel = true; render(); focusLater("#b-cc-no"); break;
      case "b-cancel-no": S.B.confirmCancel = false; render(); focusLater("#b-cancel"); break;
      case "b-cancel-yes":
        addLog("B", "Brouillon " + S.B.rec.id + " abandonné (" + S.B.rec.lines.length + " ligne(s), rien rangé)");
        toast("Brouillon abandonné : rien n'a été rangé.");
        S.B.rec = null; S.B.confirmCancel = false; S.B.unknown = null; render(); focusLater("#b-create"); break;
      case "b-del":
        ln = S.B.rec.lines.filter(function (l) { return l.id === id; })[0];
        S.B.rec.lines = S.B.rec.lines.filter(function (l) { return l.id !== id; });
        addLog("B", "Ligne supprimée : " + label(art(ln.articleId))); toast("Ligne supprimée : " + label(art(ln.articleId)) + ".");
        render(); focusLater(entryFocus("B")); break;
      case "b-merge":
        var lines = S.B.rec.lines; ln = lines.filter(function (l) { return l.id === id; })[0];
        var target = lines[bIssues(ln, lines, S.B.rec.room).dupOf];
        target.qty = String((qtyOk(target.qty) ? +target.qty : 0) + (qtyOk(ln.qty) ? +ln.qty : 0));
        S.B.rec.lines = lines.filter(function (l) { return l !== ln; });
        addLog("B", "Doublon cumulé : " + label(art(ln.articleId)) + " → " + target.qty);
        toast("Lignes cumulées : " + target.qty + " × " + label(art(ln.articleId)) + ".");
        render(); focusLater("#b-qty-" + target.id); break;
      case "b-validate": validateB(); break;
      case "c-back": goBackC(); break;
      case "c-del":
        var inv = S.C.inv[S.C.room], cl = inv.lines.filter(function (l) { return l.id === id; })[0];
        inv.lines = inv.lines.filter(function (l) { return l.id !== id; });
        addLog("C", "Ligne retirée : " + cl.qty + " × " + label(art(cl.articleId)));
        toast("Ligne retirée du pointage : " + cl.qty + " × " + label(art(cl.articleId)) + ".");
        render(); focusLater(S.C.sel ? "#c-qty" : entryFocus("C")); break;
      case "c-close":
        if (b.getAttribute("aria-disabled") === "true") { announce("Pointez au moins un article avant de clôturer."); focusLater(entryFocus("C")); break; }
        S.C.confirmClose = true; render(); focusLater("#c-close-no"); break;
      case "c-close-no": S.C.confirmClose = false; render(); focusLater("#c-close"); break;
      case "c-close-yes": closeC(); break;
      case "d-change": S.D.sel = null; S.D.unknown = null; S.D.err = null; S.D.form = null; render(); focusLater("#scan-D"); break;
      case "d-newfiche":
        S.D.unknown = { code: "", vals: { name: S.D.q.trim() }, err: null }; S.D.q = "";
        render(); focusLater(S.D.unknown.vals.name ? "#dn-format" : "#dn-name"); break;
      case "d-remove":
        ln = S.D.lines.filter(function (l) { return l.id === id; })[0]; if (!ln) break;
        S.D.lines = S.D.lines.filter(function (l) { return l !== ln; });
        addLog("D", "Ligne retirée : " + ln.qty + " × " + label(art(ln.articleId)));
        announce("Ligne retirée."); render(); focusLater(S.D.sel ? "#d-qty" : S.D.unknown ? "#dn-name" : "#scan-D"); break;
      case "d-validate": dValidate(); break;
    }
  });

  document.addEventListener("submit", function (e) {
    var f = e.target, kind = f.getAttribute("data-form"), flow = f.getAttribute("data-flow");
    e.preventDefault();
    if (kind === "scan") { var inp = f.querySelector("input"), v = inp.value; inp.value = ""; onCode(flow, v); }
    else if (kind === "a-confirm") confirmA();
    else if (kind === "c-count") countC();
    else if (kind === "b-create") createB();
    else if (kind === "newart") {
      var r = readNewArt(f), u = S[flow].unknown;
      if (!r.ok) { u.vals = r.vals; u.err = r.err; render(); focusLater("#new-" + flow + (r.err.name ? "-name" : "-format")); return; }
      var a = createArticle(r.vals, u.code, flowRoom(flow), flow);
      toast("Fiche article créée : " + label(a) + ".");
      onPick(flow, a.id);
    }
    else if (kind === "d-find") dFind(f.querySelector("input").value);
    else if (kind === "d-add") dAdd();
    else if (kind === "d-fiche") {
      var rf = readNewArt(f), uu = S.D.unknown;
      if (!rf.ok) { uu.vals = rf.vals; uu.err = rf.err; render(); focusLater(rf.err.name ? "#dn-name" : "#dn-format"); return; }
      rf.vals.exp = expDefault(S.D.room); // fiche courte : la péremption suit la pièce (proposition à valider)
      var nd = createArticle(rf.vals, uu.code, S.D.room, "D");
      toast("Fiche courte créée : " + label(nd) + ".");
      dSelect(nd.id);
    }
  });

  document.addEventListener("input", function (e) {
    var el = e.target, kind = el.getAttribute("data-input"), k = el.getAttribute("data-k");
    var nf = el.closest && el.closest('form[data-form="newart"], form[data-form="d-fiche"]');
    if (nf && k) { // brouillon de fiche article : gardé si la page se redessine
      var holder = nf.getAttribute("data-form") === "d-fiche" ? S.D.unknown : S[nf.getAttribute("data-flow")].unknown;
      if (holder) { holder.vals = holder.vals || {}; holder.vals[k] = el.value; }
      return;
    }
    if (!kind) return;
    if (kind === "search") { var fl = el.getAttribute("data-flow"); S[fl].search = el.value; updateResults(fl); return; }
    if (kind === "new") { S[el.getAttribute("data-flow")][k] = el.value; return; }
    if (kind === "a") {
      S.A.form[k] = el.value; var a = art(S.A.form.articleId);
      if (S.A.err && S.A.err[k] && !validateA()[k]) clearFieldError(S.A, k, el, 'form[data-form="a-confirm"]');
      if (k === "expiry") { $("#a-exp-state").innerHTML = aExpState(a); $("#a-actions").innerHTML = aActions(a); }
      return;
    }
    if (kind === "b") { var bl = S.B.rec.lines.filter(function (l) { return l.id === el.getAttribute("data-id"); })[0]; bl[k] = el.value; refreshB(); return; }
    if (kind === "c") {
      S.C.form[k] = el.value;
      var ca = art(S.C.sel);
      if (S.C.err && S.C.err[k] && !(k === "qty" ? qtyCheck(el.value, true) : expiryError(el.value))) clearFieldError(S.C, k, el, 'form[data-form="c-count"]');
      if (k === "qty" || k === "expiry") $("#c-exp-state").innerHTML = cExpState(ca);
      if (k === "expiry") {
        var expd = cFormExpired();
        $("#c-reason-wrap").innerHTML = cReason(expd);
        $("#c-submit").textContent = expd ? "Écarter cette ligne périmée" : "Pointer cette ligne";
        var hw = $("#view .fhead-wrap"); if (hw) hw.outerHTML = headC();
      }
      return;
    }
    if (kind === "dq") {
      S.D.q = el.value; var ul = $("#results-D"), sh = dShowResults(el.value);
      if (ul) { ul.hidden = !sh; ul.innerHTML = sh ? dResultsHtml(el.value) : ""; }
      return;
    }
    if (kind === "dadd") {
      S.D.form[k] = el.value; var aD = art(S.D.sel);
      if (S.D.err && S.D.err[k] && !(k === "qty" ? qtyCheck(el.value) : expiryError(el.value) || dExpired(aD))) clearFieldError(S.D, k, el, 'form[data-form="d-add"]');
      if (k === "expiry") $("#d-exp-state").innerHTML = dExpState(aD);
    }
  });

  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.getAttribute("data-input") === "setting") {
      var room = el.getAttribute("data-room");
      settings.alert[room] = +el.value;
      addLog(S.flow === "cmp" ? "Réglage" : S.flow, "Alerte péremption " + ROOMS[room].name + " : " + (+el.value ? el.value + " mois avant" : "aucune"));
      render(); focusLater("#set-" + room);
    }
  });

  // Clavier : recherche, lignes (Entrée = champ suivant puis retour au scan), Échap, raccourcis de D
  document.addEventListener("keydown", function (e) {
    var el = e.target, kind = el.getAttribute && el.getAttribute("data-input");
    if (kind === "search") {
      var fl = el.getAttribute("data-flow"), first = $("#results-" + fl + " button");
      if (e.key === "ArrowDown" && first) { e.preventDefault(); first.focus(); return; }
      if (e.key === "Enter") { e.preventDefault(); if (first) first.click(); return; }
      if (e.key === "Escape" && el.value) { e.preventDefault(); el.value = ""; S[fl].search = ""; updateResults(fl); return; }
    }
    if (kind === "dq" && e.key === "ArrowDown") { var firstRes = $("#results-D button"); if (firstRes) { e.preventDefault(); firstRes.focus(); } return; }
    var list = el.closest && el.closest(".results");
    if (list && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault();
      var btns = Array.prototype.slice.call(list.querySelectorAll("button")), i = btns.indexOf(el), nx = btns[i + (e.key === "ArrowDown" ? 1 : -1)];
      if (nx) nx.focus(); else if (e.key === "ArrowUp") { var sf = $("#search-" + S.flow) || $("#scan-" + S.flow); if (sf) sf.focus(); }
      return;
    }
    if (e.key === "Enter" && kind === "b") {
      e.preventDefault();
      var lid = el.getAttribute("data-id"), lk = el.getAttribute("data-k"), bl = S.B.rec.lines.filter(function (l) { return l.id === lid; })[0];
      focusLater(lk === "qty" && art(bl.articleId).exp ? "#b-exp-" + lid : entryFocus("B"));
      return;
    }
    if (e.key === "Escape") {
      if (S.flow === "A" && S.A.phase === "form") { e.preventDefault(); goBackA(); return; }
      if (S.flow === "C" && S.C.sel) { e.preventDefault(); goBackC(); return; }
      if (kind === "b") { e.preventDefault(); focusLater(entryFocus("B")); return; }
    }
  });

  // D : le simulateur de bips replié garde son état d'ouverture (interface seulement)
  document.addEventListener("toggle", function (e) { if (e.target.id === "d-sim") S.D.simOpen = e.target.open; }, true);

  // Onglets : flèches, Début, Fin
  $(".flows").addEventListener("keydown", function (e) {
    var tabs = Array.prototype.slice.call(document.querySelectorAll(".flows [role=tab]")), i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    var fwd = e.key === "ArrowRight" || e.key === "ArrowDown", back = e.key === "ArrowLeft" || e.key === "ArrowUp";
    var n = fwd ? (i + 1) % tabs.length : back ? (i + tabs.length - 1) % tabs.length : e.key === "Home" ? 0 : e.key === "End" ? tabs.length - 1 : -1;
    if (n < 0) return;
    e.preventDefault(); tabs[n].click(); tabs[n].focus();
  });

  $("#today").textContent = "Aujourd'hui (démo) : " + fr(TODAY_ISO);
  render();

  // Accès pour les tests automatisés de la maquette (rien n'est persisté)
  window.__clmoDemo = { state: S, stock: function () { return stock; }, log: function () { return log; }, catalogue: function () { return catalogue; }, settings: settings,
    simBusy: function () { return simPending; } };
})();
</script>
</body>
</html>
